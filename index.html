
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Web-GIS — Басейн річки Ірпінь</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    header {
        background: #173d5b;
        color: white;
        padding: 15px;
        text-align: center;
    }

    header h2 {
        margin: 0;
        font-size: 21px;
    }

    #map {
        width: 100%;
        height: calc(100vh - 58px);
    }
</style>
</head>

<body>

<header>
    <h2>Гідрографічна мережа басейну річки Ірпінь</h2>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map');

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

// Стилізація основної річки
const riverStyle = {
    color: '#003fbd',
    weight: 4
};

// Стилізація малих водотоків
const streamsStyle = {
    color: '#55bce8',
    weight: 2
};

// Відображення атрибутивної інформації
function createPopup(feature, layer) {
    const properties = feature.properties || {};
    let content = '<b>Інформація про об’єкт</b><hr>';

    for (const [key, value] of Object.entries(properties)) {
        content += `<b>${key}:</b> ${value ?? ''}<br>`;
    }

    layer.bindPopup(content);
}

// Створення шарів
const riverLayer = L.geoJSON(null, {
    style: riverStyle,
    onEachFeature: createPopup
}).addTo(map);

const streamsLayer = L.geoJSON(null, {
    style: streamsStyle,
    onEachFeature: createPopup
}).addTo(map);

// Завантаження просторових даних
Promise.all([
    fetch('Irpine_River.json').then(r => {
        if (!r.ok) throw new Error('Помилка завантаження річки');
        return r.json();
    }),

    fetch('Irpin_Streams.json').then(r => {
        if (!r.ok) throw new Error('Помилка завантаження водотоків');
        return r.json();
    })

]).then(([river, streams]) => {

    riverLayer.addData(streams);
    streamsLayer.addData(river);

    const bounds = L.featureGroup([
        riverLayer,
        streamsLayer
    ]).getBounds();

    if (bounds.isValid()) {
        map.fitBounds(bounds, {padding: [30, 30]});
    }

}).catch(error => {
    console.error(error);
    alert('Помилка завантаження даних: ' + error.message);
});

// Керування видимістю шарів
L.control.layers(null, {
    'Основна річка Ірпінь': riverLayer,
    'Малі водотоки': streamsLayer
}).addTo(map);

</script>

</body>
</html>
